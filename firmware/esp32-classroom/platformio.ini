[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_98:88:E0:D9:8C:60-if00
upload_speed = 115200
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_98:88:E0:D9:8C:60-if00
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
  gilmaimon/ArduinoWebsockets @ ^0.5.4
  adafruit/Adafruit SSD1306 @ ^2.5.0
